<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#dc2626" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="100%" stop-color="#eab308" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#ef4444" flood-opacity="0.45" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Tile -->
  <rect x="16" y="16" width="480" height="480" rx="100" fill="url(#bgGrad)" stroke="#38bdf8" stroke-width="6" stroke-opacity="0.3" filter="url(#glow)" />
  
  <!-- Inner Card -->
  <rect x="76" y="76" width="360" height="360" rx="60" fill="url(#cardGrad)" stroke="url(#goldGrad)" stroke-width="8" />
  
  <!-- Top Banner: PHASE -->
  <text x="256" y="145" font-family="'Outfit', 'Cairo', sans-serif" font-size="34" font-weight="900" fill="#ffffff" text-anchor="middle" letter-spacing="6">PHASE</text>
  
  <!-- Central White Disc -->
  <circle cx="256" cy="270" r="110" fill="#ffffff" stroke="#1e293b" stroke-width="6" />
  
  <!-- Center 10 -->
  <text x="256" y="318" font-family="'Outfit', 'Cairo', sans-serif" font-size="140" font-weight="900" fill="#dc2626" text-anchor="middle">10</text>
</svg>
